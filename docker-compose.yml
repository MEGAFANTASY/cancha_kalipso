services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    container_name: cancha_kalipso
    volumes:
      - ./db:/app/db
    environment:
      - DB_PATH=/app/db/usuarios.db
      - PORT=7000
      - FRONTEND_PATH=/app/frontend
      # Configurar en un archivo .env local (no subir a GitHub)
      - GSHEETS_URL=${GSHEETS_URL}
      - SYNC_INTERVAL=30
